name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wine
        run: |
          brew update
          brew install --cask wine-stable

      - name: Create macOS App
        run: |
          mkdir -p "Main.app/Contents/MacOS"
          mkdir -p "Main.app/Contents/Resources"

          cp main.exe "Main.app/Contents/Resources/main.exe"

          cat > "Main.app/Contents/MacOS/Main" <<'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")/../Resources" && pwd)"
          exec wine "$DIR/main.exe"
          EOF

          chmod +x "Main.app/Contents/MacOS/Main"

          cat > "Main.app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Main</string>
              <key>CFBundleDisplayName</key>
              <string>Main</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.main</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>Main</string>
          </dict>
          </plist>
          EOF

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "Main.app" "Main-macOS.zip"

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: Main-macOS
          path: Main-macOS.zip
